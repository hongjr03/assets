name: Release CN Thesis Fonts

on:
  push:
    branches:
      - cn-thesis-fonts
    paths:
      - fonts/cn-thesis-fonts/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare tag
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=12 "$GITHUB_SHA")"
          TAG="cn-thesis-fonts-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${SHORT_SHA}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.prep.outputs.tag }}" "$GITHUB_SHA" -m "CN thesis fonts release for ${GITHUB_SHA}"
          git push origin "${{ steps.prep.outputs.tag }}"

      - name: Package font assets
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${{ steps.prep.outputs.tag }}.zip"
          cd fonts
          zip -r "../${ARCHIVE}" cn-thesis-fonts
          cd ..
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CN Thesis Fonts ${{ steps.prep.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.prep.outputs.tag }}.zip
            ${{ steps.prep.outputs.tag }}.zip.sha256
          body: |
            Automated release for changes detected in fonts/cn-thesis-fonts on branch cn-thesis-fonts.

            Source branch: cn-thesis-fonts
            Source commit: ${{ github.sha }}
